services:


  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.2
    attach: false #prevent logging
    container_name: authentik-server
    command: server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`auth.localhost.com`)"
      - "traefik.http.routers.authentik.entrypoints=web"
      # - "traefik.http.routers.authentik.tls=false"
      # - "traefik.http.routers.authentik.tls.certresolver=le"
      - "traefik.http.routers.authentik.priority=30"
      - "traefik.http.routers.authentik.service=authentik-svc"


      - "traefik.http.routers.authentik-outpost.rule=Host(`app.localhost.com`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.authentik-outpost.entrypoints=web"
      - "traefik.http.routers.authentik-outpost.priority=20"
      - "traefik.http.routers.authentik-outpost.service=authentik-svc"

      - "traefik.http.services.authentik-svc.loadbalancer.server.port=9000"

      - "traefik.http.middlewares.authentik-auth.forwardAuth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik-auth.forwardAuth.trustForwardHeader=true"
      - "traefik.http.middlewares.authentik-auth.forwardAuth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version"
    env_file:
      - "./envs/authentik.secret.env"
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
      - authentik_templates:/templates
      - ./authentik/data:/data
    # ports:
    #   - "9010:9000"
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/-/health/ready/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped



  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.2
    attach: false #prevent logging
    container_name: authentik-worker
    command: worker
    env_file:
      - "./envs/authentik.secret.env"
    depends_on:
      - postgres
      - redis
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
      - authentik_templates:/templates
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

