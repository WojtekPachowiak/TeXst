services:

  redis:
    image: redis:8.8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb set myminio/rendered-documents --ignore-existing;
      /usr/bin/mc anonymous set download myminio/rendered-documents;
      exit 0;
      "

  restapi:
    build:
      context: ./goworkspace/restapi
      dockerfile: Dockerfile
    container_name: restapi
    ports: 
      - "8080:8080"
    env_file:
      - ./goworkspace/restapi.env
      - ./goworkspace/storage.env
    depends_on:
      - redis
      - minio
    restart: unless-stopped


  worker-latex:
    build:
      context: ./goworkspace/worker
      dockerfile: Dockerfile.typst
    container_name: worker-typst
    env_file:
      - ./goworkspace/worker.env
      - ./goworkspace/worker-typst.env
      - ./goworkspace/storage.env
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  worker-latex:
    build:
      context: ./goworkspace/worker
      dockerfile: Dockerfile.latex
    container_name: worker-latex
    env_file:
      - ./goworkspace/worker.env
      - ./goworkspace/worker-latex.env
      - ./goworkspace/storage.env
    depends_on:
      - redis
      - minio
    restart: unless-stopped
    

volumes:
  minio_data: