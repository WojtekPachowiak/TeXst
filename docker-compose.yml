services:

  redis:
    image: redis:8.8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
  
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    environment:
      REDISINSIGHT_ACCEPT_LICENSE: true
      RI_APP_HOST: 0.0.0.0
    depends_on:
      - redis

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb set myminio/rendered-documents --ignore-existing;
      # /usr/bin/mc anonymous set download myminio/rendered-documents;
      exit 0;
      "

  traefik:
    image: traefik:v3.6
    container_name: traefik
    command: 
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    env_file:
      - ./oauth2-proxy.secret.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oauth2-proxy.rule=PathPrefix(`/oauth2/`)"
      - "traefik.http.routers.oauth2-proxy.priority=20"
      # - "traefik.http.routers.oauth2-proxy.entrypoints=websecure"
      - "traefik.http.routers.oauth2-proxy.entrypoints=web"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"
      - "traefik.http.middlewares.oauth2-auth.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth"
      - "traefik.http.middlewares.oauth2-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.oauth2-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Access-Token"
      
    depends_on:
      - redis
    restart: unless-stopped

  restapi:
    build:
      context: ./goworkspace
      dockerfile: Dockerfile.restapi
    container_name: restapi
    labels:
      - "traefik.enable=true"
      # - "traefik.http.routers.restapi.rule=PathPrefix(`/api/`)"
      # # - "traefik.http.routers.restapi.entrypoints=websecure"
      # - "traefik.http.routers.restapi.entrypoints=web"
      # - "traefik.http.routers.restapi.middlewares=oauth2-auth"
      # - "traefik.http.services.restapi.loadbalancer.server.port=8080"
      # - "traefik.http.services.restapi.loadbalancer.responseforwarding.flushinterval=100ms"
      # API routes — protected by oauth2-proxy
      - "traefik.http.routers.restapi-api.rule=PathPrefix(`/api/`)"
      - "traefik.http.routers.restapi-api.entrypoints=web"
      - "traefik.http.routers.restapi-api.middlewares=oauth2-auth"
      - "traefik.http.routers.restapi-api.service=restapi-svc"
      - "traefik.http.routers.restapi-api.priority=10"

      # UI / static files — also protected, catch-all
      - "traefik.http.routers.restapi-ui.rule=PathPrefix(`/`)"
      - "traefik.http.routers.restapi-ui.entrypoints=web"
      - "traefik.http.routers.restapi-ui.middlewares=oauth2-auth"
      - "traefik.http.routers.restapi-ui.service=restapi-svc"
      - "traefik.http.routers.restapi-ui.priority=1"

      # one shared service definition
      - "traefik.http.services.restapi-svc.loadbalancer.server.port=8080"
      - "traefik.http.services.restapi-svc.loadbalancer.responseforwarding.flushinterval=100ms"
    # ports: 
      # - "8080:8080"
    env_file:
      - ./goworkspace/restapi.env
      - ./goworkspace/storage.env
    # volumes: #ONLY FOR DEV
      # - ~/Programming/tex-typst-rendering-cluster/goworkspace/restapi/static:/app/static
    depends_on:
      - redis
      - minio
    restart: unless-stopped


  worker-typst:
    build:
      context: ./goworkspace
      dockerfile: Dockerfile.worker-typst
    container_name: worker-typst
    env_file:
      - ./goworkspace/worker.env
      - ./goworkspace/worker-typst.env
      - ./goworkspace/storage.env
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  worker-latex:
    build:
      context: ./goworkspace
      dockerfile: Dockerfile.worker-latex
    container_name: worker-latex
    env_file:
      - ./goworkspace/worker.env
      - ./goworkspace/worker-latex.env
      - ./goworkspace/storage.env
    depends_on:
      - redis
      - minio
    restart: unless-stopped
    

  # ================================== monitoring/observability

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_CHECK_STREAMS: stream:latex,stream:typst
    depends_on:
      - redis
    restart: unless-stopped

  cadvisor: 
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    attach: false #prevent logging
    container_name: cadvisor
    privileged: true
    # devices:
    #   - /dev/kmsg:/dev/kmsg
    ports: 
      - "8081:8080"
    volumes: 
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    # command:
    #   - "--docker_only=true"
    #   - "--store_container_labels=false"
    #   - "--disable_root_cgroup_stats=true"
    #   - "--disable_metrics=advtcp,cpuLoad,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp"
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    attach: false
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - restapi
      - worker-latex
      - worker-typst
      - redis
      - minio


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    attach: false
    ports: 
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  minio_data:
  grafana_data:
  prometheus_data:
  redisinsight-data: