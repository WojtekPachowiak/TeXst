
  services:
    main:
      build:
        context: .
        dockerfile: Dockerfile
      volumes:
        # Mount your project directory
        - ..:/workspace
        # Mount Go modules cache (optional, for better performance)
        - go-modules-tex-typst-rendering-cluster:/go/pkg/mod
        # Mount Go build cache
        - go-build-cache-tex-typst-rendering-cluster:/root/.cache/go-build
        # bashrc settings
        - ~/.bashrc:/root/.bashrc

      environment:
        # Go environment
        GOPATH: /go
        # - GO111MODULE=on
        CGO_ENABLED: 1

      stdin_open: true
      tty: true
      # Keep container running
      command: tail -f /dev/null
      
  volumes:
    go-modules-tex-typst-rendering-cluster:
    go-build-cache-tex-typst-rendering-cluster: