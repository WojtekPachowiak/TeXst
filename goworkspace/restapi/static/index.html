\documentclass{article} % \documentclass{} is the first command in any LaTeX code. It is used to define what
kind of document you are creating such as an article or a book, and begins the document preamble

\usepackage{amsmath} % \usepackage is a command that allows you to add functionality to your LaTeX code

\title{Simple Sample} % Sets article title
\author{My Name} % Sets authors name
\date{\today} % Sets date for date compiled

% The preamble ends with the command \begin{document}
\begin{document} % All begin commands must be paired with an end command somewhere
\maketitle % creates title using information in preamble (title, author, date)

\section{Hello World!} % creates a section

\textbf{Hello World!} Today I am learning \LaTeX. %notice how the command will end at the first non-alphabet
charecter such as the . after \LaTeX
\LaTeX{} is a great program for writing math. I can write in line math such as $a^2+b^2=c^2$ %$ tells LaTexX to
compile as math
. I can also give equations their own space:
\begin{equation} % Creates an equation environment and is compiled as math
\gamma^2+\theta^2=\omega^2
\end{equation}
If I do not leave any blank lines \LaTeX{} will continue this text without making it into a new paragraph.
Notice how there was no indentation in the text after equation (1).
Also notice how even though I hit enter after that sentence and here $\downarrow$
\LaTeX{} formats the sentence without any break. Also look how it doesn't matter how many spaces I put between
my words.

For a new paragraph I can leave a blank space in my code.

    <div class="px-8 pb-5 flex flex-col gap-4">
      <div class="flex flex-row justify-between">
        <form id="renderForm">
          <div class="toolbar">
            <select id="engine">
              <option value="latex">LaTeX (pdflatex)</option>
              <option value="typst">Typst</option>
            </select>
            <select id="format">
              <option value="pdf">.pdf</option>
              <option value="png">.png</option>
            </select>
            <button type="submit" id="submitBtn">
              <span class="btn-text">Render</span>
            </button>
            <div id="status" class="status">
            </div>
            <div id="spinner" class="spinner" style="display: none;"></div>
          </div>
        </form>
        <form action="https://auth.texst.wojciechpachowiak.pl/flows/-/default/invalidation/">
